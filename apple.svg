<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="hand-drawn apple">
  <!-- 原创手绘苹果：蜡笔风，扁平红果身 + 深一号勾线 + 明黄四角星高光 -->
  <defs>
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35
                0 0 0 0 0.20
                0 0 0 0 0.15
                0 0 0 0.55 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="grainClipped"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="grainClipped"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#crayon)">
    <!-- 弯曲短果柄 -->
    <path d="M60 36 C60 26 66 17 75 13" fill="none" stroke="#6B4A3A" stroke-width="4" stroke-linecap="round"/>
    <!-- 小圆叶 -->
    <ellipse cx="45" cy="20" rx="11" ry="6.5" transform="rotate(-28 45 20)" fill="#7FA66A" stroke="#5E8550" stroke-width="2"/>
    <!-- 扁圆胖果身，顶部微凹 -->
    <path d="M60 40 C50 30 30 32 24 51 C18 70 30 100 48 106 C55 108 58 104 60 104 C62 104 65 108 72 106 C90 100 102 70 96 51 C90 32 70 30 60 40 Z"
      fill="#D94F3D" stroke="#8C3226" stroke-width="3" stroke-linejoin="round"/>
    <!-- 明黄四角星高光 -->
    <path d="M43 60 L46.5 69 L56 72.5 L46.5 76 L43 85 L39.5 76 L30 72.5 L39.5 69 Z" fill="#F2C94C"/>
  </g>
</svg>
